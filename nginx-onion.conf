# Tor onion mirror of frkn.org.
# Address: frknnkuwoa2i3rfjmlzcd3q4nczhy7o2vkqqc46vwsefx7em5cogdrid.onion
#
# One-time setup on the server:
#   1. apt install tor; keys live in /var/lib/tor/frkn-onion/
#      (backup: /root/backups/frkn-onion-keys-*.tar.gz)
#      torrc: HiddenServiceDir /var/lib/tor/frkn-onion/
#             HiddenServicePort 80 127.0.0.1:8080
#   2. cp nginx-onion.conf /etc/nginx/sites-available/onion
#      ln -s /etc/nginx/sites-available/onion /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# No TLS on purpose: onion v3 gives end-to-end encryption and address
# authentication by itself. Loopback only — the server IP stays behind Tor.
#
# Depends on the `map $http_upgrade $connection_upgrade` block from
# sites-available/api (http context, loaded once globally).

server {
    listen 127.0.0.1:8080;
    server_name frknnkuwoa2i3rfjmlzcd3q4nczhy7o2vkqqc46vwsefx7em5cogdrid.onion;
    server_tokens off;

    root /opt/frkn.org;
    index index.html;

    # Privacy: no access logs on the mirror.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API through the mirror: pages switch API_BASE to same-origin /api on
    # .onion, so Tor users never leave the Tor network. Loopback + SNI/Host
    # spoofing — the API vhost lives on this same nginx.
    location /api/ {
        proxy_pass https://127.0.0.1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.frkn.org;
        proxy_set_header Host api.frkn.org;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Short-code resolver (s.frkn.org) — used by the /sub/<code> page.
    location /s/ {
        proxy_pass https://127.0.0.1/;
        proxy_ssl_server_name on;
        proxy_ssl_name s.frkn.org;
        proxy_set_header Host s.frkn.org;
    }

    # Static assets - long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot|mp4|apk|pkg|msi)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # HTML - no cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Short-code cabinet entry: /sub/<code> -> sub/index.html (JS resolves the code)
    location ~* ^/sub/[a-z0-9-]+/?$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /sub/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
