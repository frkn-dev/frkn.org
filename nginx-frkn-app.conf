# Mini-site for frkn.app — Dopamine landing + setup guide.
# Docroot: /opt/frkn.app (sibling of /opt/frkn.org).
# Beta twin: /opt/beta/frkn.app (sibling of /opt/beta/frkn.org).
#
# One-time setup:
#   1. DNS: A/AAAA frkn.app (+ www) → this server. Remove GoDaddy forwarding first.
#   2. cp nginx-frkn-app.conf /etc/nginx/sites-available/frkn.app
#      ln -sf /etc/nginx/sites-available/frkn.app /etc/nginx/sites-enabled/
#   3. Until cert exists, comment out the 443 server and the HTTP→HTTPS return;
#      keep the ACME location + the content locations on :80.
#   4. certbot certonly --webroot -w /opt/frkn.app -d frkn.app -d www.frkn.app
#   5. Uncomment TLS, nginx -t && systemctl reload nginx
#
# Map:
#   /              → /dopamine/index.html
#   /setup/        → /setup/dopamine/index.html
#   /selfhosted/   → /selfhosted/index.html
#   /en/           → /dopamine/en/index.html
#   /en/setup/     → /en/setup/dopamine/index.html
#   /en/selfhosted/→ /en/selfhosted/index.html
#   /install       → install script (text/plain)
#   /preset/       → suggest split-preset domain (queue → CSV)
#   /preset/submit → POST → preset-inbox on 127.0.0.1:9120
#   /dopamine*     → 301 to / or /en/
#   else           → 302 https://frkn.org$request_uri
#                    (assets: /dopamine /Images /scripts /container /styles.css)

server {
    listen 80;
    listen [::]:80;
    server_name frkn.app www.frkn.app;

    location /.well-known/acme-challenge/ {
        root /opt/frkn.app;
    }

    location / {
        return 301 https://frkn.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.frkn.app;

    ssl_certificate /etc/letsencrypt/live/frkn.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frkn.app/privkey.pem;

    return 301 https://frkn.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frkn.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/frkn.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frkn.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # prod frkn.app tree (sibling of /opt/frkn.org)
    root /opt/frkn.app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /dopamine/index.html =404;
    }

    location = /setup {
        return 301 /setup/;
    }
    location = /setup/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /setup/dopamine/index.html =404;
    }

    location = /en {
        return 301 /en/;
    }
    location = /en/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /dopamine/en/index.html =404;
    }

    location = /en/setup {
        return 301 /en/setup/;
    }
    location = /en/setup/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /en/setup/dopamine/index.html =404;
    }

    location = /selfhosted {
        return 301 /selfhosted/;
    }
    location = /selfhosted/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /selfhosted/index.html =404;
    }

    location = /en/selfhosted {
        return 301 /en/selfhosted/;
    }
    location = /en/selfhosted/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /en/selfhosted/index.html =404;
    }

    location = /install {
        default_type text/plain;
        charset utf-8;
        try_files /install =404;
    }

    location = /preset {
        return 301 /preset/;
    }
    location = /preset/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files /preset/index.html =404;
    }
    location ~ ^/preset/.*\.(csv|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /preset/submit {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9120/submit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /dopamine {
        return 301 /;
    }
    location = /dopamine/ {
        return 301 /;
    }
    location = /dopamine/en {
        return 301 /en/;
    }
    location = /dopamine/en/ {
        return 301 /en/;
    }
    location = /setup/dopamine {
        return 301 /setup/;
    }
    location = /setup/dopamine/ {
        return 301 /setup/;
    }
    location = /en/dopamine {
        return 301 /en/;
    }
    location = /en/dopamine/ {
        return 301 /en/;
    }
    location = /en/setup/dopamine {
        return 301 /en/setup/;
    }
    location = /en/setup/dopamine/ {
        return 301 /en/setup/;
    }

    location = /styles.css {
        expires 7d;
        add_header Cache-Control "public";
        try_files /styles.css =404;
    }

    location ^~ /dopamine/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    location ^~ /Images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /scripts/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /container/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        return 302 https://frkn.org$request_uri;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
