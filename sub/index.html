<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="robots" content="noindex" />
    <title>FRKN — Личный кабинет</title>
    <link rel="icon" href="/Images/favicon.ico" sizes="any" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      href="/Images/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="stylesheet" href="/styles.css?v=9" />
    <style>
      .sub-redirect {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .sub-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }

      /* The boot screen flies the same mascot as the app's speedtest: two
         460 ms halves, drift up-right / down-left with a small rotation. */
      .sub-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      .sub-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .sub-loader-caption {
        color: var(--muted);
        font-size: 14px;
      }

      .sub-dino {
        width: 56px;
        height: 56px;
        display: block;
        will-change: transform;
        animation: sub-dino-flight 0.92s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      @keyframes sub-dino-flight {
        0% {
          transform: translate(-3px, 3px) rotate(-10deg);
        }
        50% {
          transform: translate(4px, -3px) rotate(8deg);
        }
        100% {
          transform: translate(-3px, 3px) rotate(-10deg);
        }
      }

      @media (max-width: 640px) {
        .sub-dino {
          width: 40px;
          height: 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sub-dino {
          animation: none;
        }
      }

      @keyframes sub-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sub-card h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      .sub-card p {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 20px;
      }

      .sub-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .sub-actions a {
        color: var(--accent);
        font-size: 14px;
        text-decoration: none;
        border-bottom: 1px solid rgba(56, 189, 248, 0.4);
      }

      .sub-actions a:hover {
        border-bottom-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="sub-redirect">
      <!-- Boot screen is the mascot alone; the card below only exists for errors. -->
      <div class="sub-loader" id="loader">
        <img class="sub-dino" src="/Images/pterodactyl.png" alt="" />
      </div>
      <div class="sub-card" id="error-card" hidden>
        <h1 id="title"></h1>
        <p id="text"></p>
        <div class="sub-actions" id="actions">
          <a href="/" id="home-link">На главную</a>
          <a href="/activate" id="activate-link">Активировать ключ</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var ru = (navigator.language || "ru").toLowerCase().indexOf("ru") === 0;

        var i18n = ru
          ? {
              loading: "Загрузка…",
              badLink: "Ссылка должна выглядеть как frkn.org/sub/xxxx-xxxx-xx",
              notFound: "Код не найден",
              notFoundText:
                "Проверь код или открой кабинет по полной ссылке из письма.",
              home: "На главную",
              activate: "Активировать ключ",
            }
          : {
              loading: "Loading…",
              badLink: "The link should look like frkn.org/sub/xxxx-xxxx-xx",
              notFound: "Code not found",
              notFoundText:
                "Check the code or open your dashboard via the full link.",
              home: "Home",
              activate: "Activate key",
            };

        var loader = document.getElementById("loader");
        var errorCard = document.getElementById("error-card");
        var titleEl = document.getElementById("title");
        var textEl = document.getElementById("text");
        var actions = document.getElementById("actions");

        function fail(title, text) {
          loader.style.display = "none";
          errorCard.hidden = false;
          titleEl.textContent = title;
          textEl.textContent = text;
          document.getElementById("home-link").textContent = i18n.home;
          document.getElementById("activate-link").textContent = i18n.activate;
        }

        // Коды живут на проде — резолвер всегда s.frkn.org, даже локально
        var m = location.pathname.match(/^\/sub\/([A-Za-z0-9-]+)\/?$/);
        if (!m) {
          var savedCode = "";
          var savedId = "";
          var savedLang = "";
          try {
            savedCode = localStorage.getItem("frkn_sub_code") || "";
            savedId = localStorage.getItem("frkn_sub_id") || "";
            savedLang = localStorage.getItem("frkn-lang") || "";
          } catch (e) {}
          if (/^[a-z0-9-]+$/.test(savedCode)) {
            location.replace("/sub/" + savedCode);
            return;
          }
          if (savedId) {
            location.replace(savedLang === "en" ? "/en/subscription/" : "/subscription/");
            return;
          }
          fail(i18n.notFound, i18n.badLink);
          return;
        }

        var code = m[1].toLowerCase();
        try {
          localStorage.setItem("frkn_sub_code", code);
        } catch (e) {}

        var S_BASE = location.hostname.endsWith(".onion")
          ? location.origin + "/s"
          : "https://s.frkn.org";

        fetch(S_BASE + "/" + code, {
          headers: { Accept: "application/json" },
        })
          .then(function (r) {
            return r.ok ? r.json() : Promise.reject(r.status);
          })
          .then(function (data) {
            var id = data && data.subscription_id;
            if (!id) return Promise.reject("no-id");
            var saved = "";
            try {
              saved = localStorage.getItem("frkn-lang") || "";
            } catch (e) {}
            var lang = saved === "en" || saved === "ru" ? saved : ru ? "ru" : "en";
            var env = "";
            try {
              env = new URLSearchParams(location.search).get("env") || "";
            } catch (e) {}
            try {
              sessionStorage.setItem(
                "frkn_sub_boot",
                JSON.stringify({ code: code, id: id, env: env }),
              );
            } catch (e) {}
            return fetch(lang === "en" ? "/en/subscription/" : "/subscription/").then(
              function (page) {
                if (!page.ok) return Promise.reject(page.status);
                return page.text();
              },
            );
          })
          .then(function (html) {
            if (!html) return;
            // The cabinet must not fly the mascot again: this screen already does,
            // and the second flight after the document swap read as a page blink.
            try { sessionStorage.setItem("lk_boot_seen", "1"); } catch (e) {}
            document.open();
            // document.open() empties the document, and the empty document
            // paints white — on a dark site that is a visible flash between the
            // mascot and the cabinet. Paint the same background first.
            var bg = "#090b10";
            try {
              var bodyBg = getComputedStyle(document.body).backgroundColor;
              if (bodyBg && bodyBg !== "rgba(0, 0, 0, 0)") bg = bodyBg;
            } catch (e) {}
            document.write(
              '<style>html,body{background:' + bg + ";margin:0}</style>",
            );
            document.write(html);
            document.close();
          })
          .catch(function () {
            fail(i18n.notFound, i18n.notFoundText);
          });
      })();
    </script>
  </body>
</html>
