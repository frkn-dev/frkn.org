# Production vhost for frkn.org, served from our own nginx (api server)
# instead of GitHub Pages. Modeled on nginx-testflight.conf.
#
# One-time setup on the server:
#   1. cp nginx-site.conf /etc/nginx/sites-available/frkn.org
#      ln -s /etc/nginx/sites-available/frkn.org /etc/nginx/sites-enabled/
#   2. TLS: until DNS points here, certbot --nginx can't pass HTTP-01.
#      Either switch DNS first (site flips atomically, Pages keeps serving
#      until then) or issue with a DNS challenge.
#   3. nginx -t && systemctl reload nginx
#
# Test before the DNS switch:
#   curl -k --resolve frkn.org:443:<server-ip> https://frkn.org/

server {
    listen 80;
    listen [::]:80;
    server_name frkn.org www.frkn.org;

    return 301 https://frkn.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.frkn.org;

    ssl_certificate /etc/letsencrypt/live/frkn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frkn.org/privkey.pem;

    # www -> apex
    return 301 https://frkn.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frkn.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/frkn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frkn.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /opt/frkn.org;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets - long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot|mp4|apk|pkg|msi)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # HTML - no cache (Pages behaves the same)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Pretty URLs like Pages: /subscription -> /subscription/index.html,
    # /x -> /x.html
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # VCS metadata and dotfiles are not public
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
